services:
  product-db:
    image: postgres:17
    container_name: retailops-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: retailops
      POSTGRES_PASSWORD: retailops_local_password
    ports:
      - "5433:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailops -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  product-db-data: